<style>

</style>
<script>
(function(){
 const DS=/*MA*/["105ef64bfd56622b", "11d969bd2e221ec3", "13b4eee958a5245b", "19c55529c6a4570a", "2b403e6690166db5", "4bc52c5d1bdad1f3", "4c031fbd91e19662", "5053cdbc08fb69bc", "575667d0f557763e", "5a68a21d7cc454d0", "5fdf4c576aebb6bb", "638f2e1ae4185355", "6a56a1c1cf69b4c5", "78434c20cdba4b60", "7e0b03b2bbda439c", "816d00517a617245", "88613a02bf9f76f6", "909810ebeff7b87e", "90f43f736f00ba66", "a6460e5df659d85a", "b6ce926ce0497fef", "b6da637db9e21002", "ba59e5a581a34ee0", "ba77c5e67f0238c6", "bc68247d13c1a925", "c035e6a729923ec1", "c14860b9fe58a37e", "c4ddd1bf23890341", "c59d3a08d3feab7b", "cbbcf2ffbb634b40", "cced710b8b6a3261", "e403d08f9cacbe98", "ea78c6925693b2ed", "f41265dc554cb681"]/*HET*/,TEN=/*TEN*/"Học tiếng Anh theo tuần - lớp 2A8"/*HET*/;
 function bam(s){
  const K=[],H=[],f=x=>(x-Math.floor(x))*4294967296|0;
  for(let n=2,i=0;i<64;n++){let p=1;for(let d=2;d*d<=n;d++)if(n%d===0){p=0;break}if(p){if(i<8)H[i]=f(Math.sqrt(n));K[i++]=f(Math.cbrt(n))}}
  const b=[];for(let i=0;i<s.length;i++)b.push(s.charCodeAt(i)&255);
  const L=b.length*8;b.push(128);while(b.length%64!==56)b.push(0);
  for(let j=7;j>=0;j--)b.push(j>3?0:(L>>>(j*8))&255);
  const r=(x,n)=>(x>>>n)|(x<<(32-n)),w=[];
  for(let o=0;o<b.length;o+=64){
   for(let i=0;i<16;i++)w[i]=(b[o+i*4]<<24)|(b[o+i*4+1]<<16)|(b[o+i*4+2]<<8)|b[o+i*4+3];
   for(let i=16;i<64;i++){const x=w[i-15],y=w[i-2];w[i]=(w[i-16]+(r(x,7)^r(x,18)^(x>>>3))+w[i-7]+(r(y,17)^r(y,19)^(y>>>10)))|0}
   let [a,c,d,e,g,h,k,l]=H;
   for(let i=0;i<64;i++){
    const t1=(l+(r(g,6)^r(g,11)^r(g,25))+((g&h)^(~g&k))+K[i]+w[i])|0,t2=((r(a,2)^r(a,13)^r(a,22))+((a&c)^(a&d)^(c&d)))|0;
    l=k;k=h;h=g;g=(e+t1)|0;e=d;d=c;c=a;a=(t1+t2)|0}
   H[0]=(H[0]+a)|0;H[1]=(H[1]+c)|0;H[2]=(H[2]+d)|0;H[3]=(H[3]+e)|0;H[4]=(H[4]+g)|0;H[5]=(H[5]+h)|0;H[6]=(H[6]+k)|0;H[7]=(H[7]+l)|0}
  return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('')}
 const gon=m=>String(m||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/gi,'d').toUpperCase().replace(/[^A-Z0-9]/g,'');
 const dung=m=>{m=gon(m);return m.length>0&&DS.indexOf(bam('gocbang2a8|'+m).slice(0,16))>=0};
 // Báo cho trang thống kê của lớp biết bạn này đã vào chơi. Mỗi máy mỗi ngày báo một lần, mất mạng thì thôi, không ảnh hưởng trò chơi.
 const bao=m=>{try{

  fetch('https://dao-kho-bau-toan.vercel.app/api/tham-gia',{method:'POST',headers:{'Content-Type':'application/json'},keepalive:true,body:JSON.stringify({loai:'ghe',ma:m})})
   .then(r=>{if(r.ok)try{localStorage.setItem('gb2a8bao',n)}catch(e){}}).catch(()=>{})}catch(e){}};
 let nho='';try{nho=localStorage.getItem('gb2a8ma')||''}catch(e){}

 if(dung(nho)||(nho&&nho===duyet)){bao(nho);return}
 const goc=document.documentElement;
 goc.classList.add('khoa');
 const c=document.createElement('div');c.id='congMa';
 c.innerHTML='<div class="hop"><div class="bang"></div><p>Bố mẹ nhập <b>mã riêng của con</b> để vào nhé.</p><input id="oMa" maxlength="12" inputmode="numeric" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="Mã của con" aria-label="Mã của con"><p class="nho" id="vdMa" style="margin-top:6px"></p><p class="loi" id="loiMa" hidden>Mã chưa đúng. Bố mẹ xem lại mã trong tin nhắn riêng nhé.</p><button id="vaoMa" type="button">Vào</button><p class="nho">Mã nằm trong tin nhắn riêng ban đại diện lớp gửi bố mẹ. Nhập đúng một lần, lần sau máy tự nhớ.</p></div>';
 c.querySelector('.bang').textContent=TEN;c.querySelector('#vdMa').textContent='Mã gồm 6 số';
 const o=c.querySelector('#oMa'),loi=c.querySelector('#loiMa');
 const mo=()=>{goc.classList.remove('khoa');c.remove();scrollTo(0,0)};
 // Mã không có trong danh sách của trang thì hỏi máy chủ Đảo Kho Báu (danh sách mới nhất của lớp).
 const hoi=m=>fetch('https://dao-kho-bau-toan.vercel.app/api/tham-gia',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({loai:'ghe',ma:m})})
  .then(r=>r.ok?r.json().catch(()=>({})).then(j=>j.ok!==false):false);
 let dangHoi=false;
 const vao=()=>{
  const m=gon(o.value);
  if(dung(m)){try{localStorage.setItem('gb2a8ma',m)}catch(e){}bao(m);mo();return}
  if(!m||dangHoi){if(!m){loi.hidden=false;o.select()}return}
  dangHoi=true;const nut=c.querySelector('#vaoMa'),chu=nut.textContent;nut.textContent='Đang kiểm tra…';nut.disabled=true;
  hoi(m).then(okk=>{
   if(okk){try{localStorage.setItem('gb2a8ma',m);localStorage.setItem('gb2a8duyet',m);localStorage.setItem('gb2a8bao',new Date().toDateString())}catch(e){}mo()}
   else{loi.textContent='Mã chưa đúng. Bố mẹ xem lại mã trong tin nhắn riêng nhé.';loi.hidden=false;o.select()}
  }).catch(()=>{loi.textContent='Chưa kiểm tra được mã vì mạng chập chờn. Bố mẹ bấm Vào lại nhé.';loi.hidden=false})
  .finally(()=>{dangHoi=false;nut.textContent=chu;nut.disabled=false})};
 c.querySelector('#vaoMa').onclick=vao;
 o.onkeydown=e=>{if(e.key==='Enter')vao()};
 o.oninput=()=>{loi.hidden=true};
 (function gan(){if(document.body)document.body.insertBefore(c,document.body.firstChild);else requestAnimationFrame(gan)})();
})();
</script>

<title>Học tiếng Anh theo tuần - Tuần 14</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: a chalkboard header over a paper desk; one big card in the middle, chunky tap targets for 7-year-olds */
:root{
  --bg:#f3f6ee; --paper:#ffffff; --ink:#22312a; --muted:#5f7068;
  --board:#2f5d4a; --chalk:#f7f3e3; --sun:#f4b63b; --sky:#3a86d6;
  --good:#2e9b5b; --bad:#d9534f; --line:#d9e2d6; --soft:#e8efe4; --rec:#e0475b;
  --display:"Baloo 2","Nunito",system-ui,sans-serif;
  --body:"Nunito",system-ui,sans-serif;
  --ipa:"Noto Sans","Segoe UI","DejaVu Sans",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#18211d; --paper:#22302a; --ink:#eef3ea; --muted:#a8b8ae; --board:#1f4636; --chalk:#f7f3e3;
  --sun:#f6c45a; --sky:#6aa8ec; --good:#4cc27e; --bad:#ef7470; --line:#34473e; --soft:#2b3b34; --rec:#f0687a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#18211d; --paper:#22302a; --ink:#eef3ea; --muted:#a8b8ae; --board:#1f4636; --chalk:#f7f3e3;
  --sun:#f6c45a; --sky:#6aa8ec; --good:#4cc27e; --bad:#ef7470; --line:#34473e; --soft:#2b3b34; --rec:#f0687a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45}
.wrap{max-width:640px;margin:0 auto;padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.board{background:var(--board);color:var(--chalk);border-radius:18px;padding:14px 18px;border:6px solid #8a6a43;display:flex;align-items:center;gap:12px;justify-content:space-between}
header.board h1{font-family:var(--display);font-size:1.5rem;margin:0;line-height:1.1;text-wrap:balance}
header.board small{opacity:.8;font-size:.85rem}
.stars{font-family:var(--display);font-size:1.3rem;white-space:nowrap}
button,.btn{font:inherit;cursor:pointer;border:none;border-radius:14px;color:inherit}
button:focus-visible,label.btn:focus-within{outline:3px solid var(--sky);outline-offset:2px}
.btn{background:var(--paper);border:2px solid var(--line);padding:12px 16px;font-weight:800;min-height:52px;display:inline-flex;align-items:center;justify-content:center;text-align:center}
.btn.primary{background:var(--sun);border-color:var(--sun);color:#2a1e00}
.btn.blue{background:var(--sky);border-color:var(--sky);color:#fff}
.btn.red{background:var(--rec);border-color:var(--rec);color:#fff}
.btn[disabled]{opacity:.45;cursor:default}
.btn:active{transform:translateY(2px)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}
.card{background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:18px;margin-top:14px}
.label{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}
.pic{width:100%;max-width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:14px;background:var(--soft);display:block}
.word{font-family:var(--display);font-size:2.3rem;line-height:1.1;margin:10px 0 2px}
.ipa{font-family:var(--ipa);font-size:1.25rem;color:var(--sky)}
.read{color:var(--muted);font-size:.95rem}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}

.opt.no{border-color:var(--bad);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.prog{height:12px;background:var(--soft);border-radius:999px;overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;background:var(--good);width:0;transition:width .3s}
.stage{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.stage button{font:inherit;font-size:.85rem;font-weight:800;padding:8px 12px;min-height:40px;border:0;border-radius:999px;background:var(--soft);color:var(--muted);cursor:pointer}
.stage button.hm{background:#fff;border:2px solid var(--line);color:var(--ink,#22332b)}
#nextBox{position:sticky;bottom:10px;z-index:6}
#nextBox .btn{box-shadow:0 6px 18px rgba(0,0,0,.28);font-size:1.1rem}
#nextBox .nfb{background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 10px;margin-top:10px;font-weight:800;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.stage button.on{background:var(--sun);color:#2a1e00}
.stage button.done{background:var(--good);color:#fff}
.slots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:14px 0;min-height:52px}
.slot{width:40px;height:48px;border-bottom:4px solid var(--muted);font-family:var(--display);font-size:1.6rem;display:flex;align-items:center;justify-content:center}
.gap{width:16px}
.tiles{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tile{width:46px;height:52px;background:var(--sun);color:#2a1e00;font-family:var(--display);font-size:1.5rem;border-radius:12px}
.tile[disabled]{opacity:.2}
.tile.no{background:var(--bad);color:#fff;animation:shake .35s}
.tile.ok{background:var(--good);color:#fff}
input.type{width:100%;font:800 1.5rem var(--display);padding:12px;border-radius:14px;border:3px solid var(--line);background:var(--bg);color:var(--ink);text-align:center;margin-top:12px}
.fb{min-height:28px;font-weight:800;margin-top:10px;text-align:center}
.fb.ok{color:var(--good)} .fb.no{color:var(--bad)}
.learnlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.mini{background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:8px;text-align:left}
.mini b{font-family:var(--display);font-size:1.15rem;display:block;margin-top:4px}
.mini span{font-family:var(--ipa);color:var(--sky);font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{background:var(--soft);border:2px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:800;min-height:44px}
.center{text-align:center}
.big{font-family:var(--display);font-size:3rem;line-height:1}
p.tip{color:var(--muted);font-size:.95rem;margin:.4em 0}
/* flip card */
.flip{perspective:1200px;margin-top:10px;cursor:pointer}
.flip-in{display:grid;transition:transform .55s;transform-style:preserve-3d}
.flip.flipped .flip-in{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;padding:14px;border:3px solid var(--line);background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:330px}
.face.back{transform:rotateY(180deg);background:var(--board);color:var(--chalk);border-color:#8a6a43}
.face.back .ipa{color:var(--sun);font-size:1.6rem}
.face.back .vi{background:var(--chalk);color:#22312a;font-size:1.3rem}
.face.back .read{color:var(--chalk);opacity:.85}
.turn{font-size:.85rem;color:var(--muted);margin-top:6px}
.face.back .turn{color:var(--chalk);opacity:.7}
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--sun)}
/* recorder */
.rec{margin-top:14px;padding:12px;border:2px dashed var(--line);border-radius:16px}
.rec .btn.recording{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
/* extra letter */
.extra{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:16px 0}
/* fill blank */
.sent{font-family:var(--display);font-size:1.5rem;line-height:1.6;text-align:center;margin-top:12px}
.blank{font:800 1.3rem var(--display);border:none;border-bottom:4px dashed var(--sky);background:var(--soft);color:var(--ink);text-align:center;border-radius:8px 8px 0 0;padding:2px 6px;max-width:100%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>

 voice=voices.find(x=>x.name===saved)||voices[0]||null;const sel=document.getElementById('vsel');if(sel)fillVoices(sel)}catch(e){}}
function fillVoices(sel){if(!sel)return;sel.innerHTML=voices.map(x=>`<option value="${esc(x.name)}"${voice&&x.name===voice.name?' selected':''}>${GIRL.test(x.name)?'👧 ':''}${esc(x.name.replace(/Microsoft |Google /,''))}</option>`).join('')||'<option>Giọng mặc định</option>'}

function say(t,slow){const tts=()=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(voice)u.voice=voice;u.rate=slow?0.6:0.78;u.pitch=1;speechSynthesis.speak(u)}catch(e){}};try{const a=VAUD[slow?t+'|s':t]||VAUD[t];if(!a){tts();return}try{speechSynthesis.cancel()}catch(e){}if(vAu){try{vAu.pause()}catch(e){}}const au=new Audio(a);vAu=au;try{au.preservesPitch=true;au.playbackRate=(slow&&!VAUD[t+'|s'])?0.75:1}catch(e){}let bad=false;const fb=()=>{if(bad||vAu!==au)return;bad=true;tts()};au.onerror=fb;const p=au.play();if(p&&p.catch)p.catch(fb)}catch(e){tts()}}

/* tiếng mừng / tiếng báo sai: phát bằng thẻ audio để điện thoại (kể cả iPhone gạt im lặng) vẫn nghe được */
function mkTone(notes){const sr=22050;let n=0;notes.forEach(x=>n+=Math.round(x[1]*sr));const d=new Int16Array(n);let p=0;
 notes.forEach(x=>{const f=x[0],L=Math.round(x[1]*sr);for(let i=0;i<L;i++){const t=i/sr,env=Math.min(1,i/200)*Math.exp(-3*t/x[1]);d[p++]=Math.round(32767*.55*env*(Math.sin(2*Math.PI*f*t)+.3*Math.sin(4*Math.PI*f*t))/1.3)}});
 const b=new Uint8Array(44+n*2),v=new DataView(b.buffer),ws=(o,s)=>{for(let i=0;i<s.length;i++)b[o+i]=s.charCodeAt(i)};
 ws(0,'RIFF');v.setUint32(4,36+n*2,true);ws(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);ws(36,'data');v.setUint32(40,n*2,true);
 for(let i=0;i<n;i++)v.setInt16(44+i*2,d[i],true);let s='';for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return 'data:audio/wav;base64,'+btoa(s)}
let SFX=null;
function sfxInit(){if(SFX)return;try{SFX={ok:new Audio(mkTone([[523,.11],[659,.11],[784,.11],[1047,.32]])),no:new Audio(mkTone([[330,.16],[247,.3]]))};SFX.ok.preload=SFX.no.preload='auto'}catch(e){SFX={}}}
try{sfxInit()}catch(e){}
function beepOld(ok){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);const t=ac.currentTime;
 if(ok){o.frequency.setValueAtTime(660,t);o.frequency.setValueAtTime(990,t+.1)}else{o.frequency.setValueAtTime(220,t)}
 g.gain.setValueAtTime(.4,t);g.gain.exponentialRampToValueAtTime(.001,t+.35);o.start(t);o.stop(t+.35)}catch(e){}}
function beep(ok){try{sfxInit();const a=SFX[ok?'ok':'no'];if(!a){beepOld(ok);return}a.currentTime=0;a.volume=ok?1:.7;const p=a.play();if(p&&p.catch)p.catch(()=>beepOld(ok))}catch(e){beepOld(ok)}}

  let exact=0,part=0,simSum=0;
  const rows=tw.map(t=>{let bs=0,bw='';for(const s of sw){const v=gSim(t,s);if(v>bs){bs=v;bw=s}}return{t,s:bw,v:bs}});

 let tries=0, hints=0;
 $('#hint').onclick=()=>{hints++;const a=$('#ans');a.value=w.en.slice(0,Math.min(w.en.length,hints+1));a.focus()};
 const chk=()=>{const v=norm($('#ans').value);
  if(v===norm(w.en)){$('#ans').disabled=true;$('#chk').disabled=true;say(w.en);result(true,w,'Viết đúng chính tả! ✏️')}
  else{tries++;if(tries>=2){$('#ans').value='';miss(w,`Từ đúng là: ${w.en}. Con gõ lại nhé!`)}else miss(w,'Gần đúng rồi, nghe lại và sửa nhé!')}};
 $('#chk').onclick=chk;$('#ans').onkeydown=e=>{if(e.key==='Enter')chk()};
 setTimeout(()=>{const a=$('#ans');if(!a)return;say(w.en);a.focus()},300);
}
function finish(){
 stopRec();
 if(stars>best){best=stars;try{localStorage.setItem('gb14best',best)}catch(e){}}
 const hard=W.filter(w=>G.miss[w.id]).sort((a,b)=>G.miss[b.id]-G.miss[a.id]);
 app.innerHTML=head()+`<div class="card center"><div class="big">🏆</div><div class="word">Hoàn thành!</div>
 <p>Con được <b>⭐ ${stars}</b> ngôi sao.</p>
 ${hard.length?`<p class="tip">Từ cần ôn thêm (chạm để mở thẻ lật):</p><div class="learnlist">${hard.map(w=>`<button class="mini" onclick="learn(${W.indexOf(w)})"><b>${w.en}</b><span>${w.ipa}</span><div class="read">${w.vi} · sai ${G.miss[w.id]} lần</div></button>`).join('')}</div>`:'<p>Không sai từ nào. Tuyệt vời! 🌟</p>'}
 <div class="rec" style="text-align:left">
  <div class="label">📨 Gửi kết quả cho cô</div>
  <label for="kidName" class="tip" style="display:block">Tên của con</label>
  <input class="type" id="kidName" style="margin-top:4px;font-size:1.2rem" placeholder="Ví dụ: Nguyễn Minh An" autocomplete="off">
  <textarea id="report" readonly rows="6" style="width:100%;margin-top:10px;font:600 .95rem var(--body);padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical"></textarea>
  <div class="row" style="margin-top:10px"><button class="btn primary" id="copyRep">📋 Sao chép kết quả</button></div>
  <p class="tip" id="copyTip">Sao chép xong, bố mẹ dán vào nhóm Zalo lớp 2A8 để gửi cô nhé.</p>
 </div>
 <div class="row" style="margin-top:14px"><button class="btn" onclick="home()">Về đầu</button><button class="btn primary" onclick="play(G.list)">Chơi lại</button></div></div>`;
 beep(1);
 const nm=$('#kidName'),rep=$('#report');
 try{nm.value=localStorage.getItem('gb14name')||''}catch(e){}
 const d=new Date(),p=n=>String(n).padStart(2,'0');
 const build=()=>{const name=nm.value.trim()||'(chưa ghi tên)';
  rep.value=`🌟 Học tiếng Anh Tuần 14 – Lớp 2A8\nBé: ${name}\nĐã chơi: ${G.list.map(k=>STAGES[k].name.replace(/^\S+\s/,'')).join(', ')}\nĐiểm: ⭐ ${stars}/${G.total}\n${hard.length?'Từ cần ôn: '+hard.map(w=>w.en).join(', '):'Không sai từ nào 🎉'}\nThời gian: ${p(d.getHours())}:${p(d.getMinutes())} ngày ${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()}`};
 build();
 nm.oninput=()=>{build();try{localStorage.setItem('gb14name',nm.value.trim())}catch(e){}};
 $('#copyRep').onclick=()=>{build();const ok=()=>{$('#copyTip').textContent='Đã sao chép! Mở nhóm Zalo lớp và dán vào ô tin nhắn nhé.'};
  const fail=()=>{rep.focus();rep.select();$('#copyTip').textContent='Máy chưa tự sao chép được. Chữ đã được bôi đen, bấm giữ rồi chọn Sao chép nhé.'};
  try{navigator.clipboard.writeText(rep.value).then(ok,fail)}catch(e){fail()}};
}
home();
</script>

</body></html>
