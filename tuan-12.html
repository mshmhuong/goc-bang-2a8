 function bam(s){
  const K=[],H=[],f=x=>(x-Math.floor(x))*4294967296|0;

  return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('')}

 const dung=m=>{m=gon(m);return m.length>0&&DS.indexOf(bam('gocbang2a8|'+m).slice(0,16))>=0};

 c.innerHTML='<div class="hop"><div class="bang"></div><p>Bố mẹ nhập <b>mã riêng của con</b> để vào nhé.</p><input id="oMa" maxlength="12" inputmode="numeric" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="Mã của con" aria-label="Mã của con"><p class="nho" id="vdMa" style="margin-top:6px"></p><p class="loi" id="loiMa" hidden>Mã chưa đúng. Bố mẹ xem lại mã trong tin nhắn riêng nhé.</p><button id="vaoMa" type="button">Vào</button><p class="nho">Mã nằm trong tin nhắn riêng ban đại diện lớp gửi bố mẹ. Nhập đúng một lần, lần sau máy tự nhớ.</p></div>';
 c.querySelector('.bang').textContent=TEN;c.querySelector('#vdMa').textContent='Mã gồm 6 số';

 const hoi=m=>fetch('https://dao-kho-bau-toan.vercel.app/api/tham-gia',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({loai:'ghe',ma:m,tuan:TUAN})})

   if(okk){try{localStorage.setItem('gb2a8ma',m);localStorage.setItem('gb2a8duyet',m);localStorage.setItem(KB,new Date().toDateString())}catch(e){}mo()}
   else{loi.textContent='Mã chưa đúng. Bố mẹ xem lại mã trong tin nhắn riêng nhé.';loi.hidden=false;o.select()}
  }).catch(()=>{loi.textContent='Chưa kiểm tra được mã vì mạng chập chờn. Bố mẹ bấm Vào lại nhé.';loi.hidden=false})
  .finally(()=>{dangHoi=false;nut.textContent=chu;nut.disabled=false})};
 c.querySelector('#vaoMa').onclick=vao;
 o.onkeydown=e=>{if(e.key==='Enter')vao()};

<style>

:root[data-theme="dark"]{

<script>

/* tiếng mừng / tiếng báo sai: phát bằng thẻ audio để điện thoại (kể cả iPhone gạt im lặng) vẫn nghe được */
function mkTone(notes){const sr=22050;let n=0;notes.forEach(x=>n+=Math.round(x[1]*sr));const d=new Int16Array(n);let p=0;
 notes.forEach(x=>{const f=x[0],L=Math.round(x[1]*sr);for(let i=0;i<L;i++){const t=i/sr,env=Math.min(1,i/200)*Math.exp(-3*t/x[1]);d[p++]=Math.round(32767*.55*env*(Math.sin(2*Math.PI*f*t)+.3*Math.sin(4*Math.PI*f*t))/1.3)}});
 const b=new Uint8Array(44+n*2),v=new DataView(b.buffer),ws=(o,s)=>{for(let i=0;i<s.length;i++)b[o+i]=s.charCodeAt(i)};
 ws(0,'RIFF');v.setUint32(4,36+n*2,true);ws(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);ws(36,'data');v.setUint32(40,n*2,true);
 for(let i=0;i<n;i++)v.setInt16(44+i*2,d[i],true);let s='';for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return 'data:audio/wav;base64,'+btoa(s)}

const SRC=window.SpeechRecognition||window.webkitSpeechRecognition;
const gN=s=>String(s).toLowerCase().replace(/[^a-z ]/g,'').replace(/\s+/g,' ').trim();

const gSim=(a,b)=>{const L=Math.max(a.length,b.length);return L?1-gLev(a,b)/L:1};
function startSR(hk){

 if(!SRC||location.protocol==='file:')return o; /* mở từ file trong máy thì nhận chữ làm trình duyệt hỏi micro mỗi lần, nên bỏ qua */

    const joined=top.map(x=>x.transcript).join(' ');const conf=top.reduce((s,x)=>s+(x.confidence||0),0)/Math.max(1,top.length);
    o.alts.push({t:joined,c:conf});const f=e.results[0];for(let k=1;k<f.length;k++)o.alts.push({t:f[k].transcript,c:f[k].confidence||0})}catch(x){}try{const fin=e.results[e.results.length-1].isFinal,tg=hk&&hk.target?gN(hk.target):'';const hit=tg&&o.alts.some(z=>(' '+gN(gFix(z.t))+' ').includes(' '+tg+' '));if((fin||hit)&&!o.fired){o.fired=1;hk&&hk.done&&hk.done()}}catch(x){}};

/* giờ học không tính lúc tắt màn hình hay chuyển sang ứng dụng khác */
let tkAn=0;document.addEventListener('visibilitychange',()=>{if(typeof G==='undefined'||!G||!G.t0)return;if(document.hidden)tkAn=Date.now();else if(tkAn){G.t0+=Date.now()-tkAn;tkAn=0}});
/* báo về máy chủ lớp: con vừa học xong một lượt. Mất mạng thì giữ lại, lần sau mở trang gửi tiếp. */
function tkGui(){let h=[];try{h=JSON.parse(localStorage.getItem('gb2a8cho')||'[]')}catch(e){}if(!h.length||tkGui.dang)return;tkGui.dang=1;
 fetch(TK_MAY+'/api/tham-gia',{method:'POST',headers:{'Content-Type':'application/json'},keepalive:true,body:JSON.stringify(h[0])})
  .then(r=>{tkGui.dang=0;if(r.status<500){h.shift();try{localStorage.setItem('gb2a8cho',JSON.stringify(h))}catch(e){}tkGui()}}).catch(()=>{tkGui.dang=0})}
function baoHoc(){try{if(!G||G.bao||!G.t0||!stars||!TK_TUAN)return;const ma=localStorage.getItem('gb2a8ma');if(!ma)return;G.bao=1;
 const giay=Math.max(1,Math.min(3600,Math.round((Date.now()-G.t0)/1000)));
 const h=JSON.parse(localStorage.getItem('gb2a8cho')||'[]');h.push({loai:'hoc',ma,tuan:TK_TUAN,sao:Math.min(300,stars),giay});localStorage.setItem('gb2a8cho',JSON.stringify(h.slice(-30)));tkGui()}catch(e){}}
addEventListener('online',tkGui);tkGui();
const tkGio=s=>!s?'-':s<60?s+' giây':s<3600?Math.round(s/60)+' phút':Math.floor(s/3600)+' giờ '+Math.round(s%3600/60)+' phút';
function thongKe(){
 baoHoc();stopRec();
 const khung=t=>{app.innerHTML=`<div class="card"><div class="label">📊 Thống kê Tuần ${TK_TUAN}</div><p class="tip">Các bạn lớp 2A8 đã vào học tuần này.</p>${t}<p class="tip" style="margin-top:12px">Lượt học, sao và thời gian bắt đầu ghi từ ngày 14/11. Số liệu mới hiện sau khoảng 5 phút.</p><div class="row" style="margin-top:12px"><button class="btn primary" onclick="home()">← Về đầu</button></div></div>`;scrollTo(0,0)};
 khung('<p class="tip center" style="margin-top:14px">Đang tải… ⏳</p>');
 fetch(TK_MAY+'/api/so-lieu',{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{
  const ds=(d.thamGia||[]).filter(x=>(x.ta||{})[TK_TUAN]||(x.hoc||{})[TK_TUAN]).map(x=>Object.assign({ten:x.ten,ma:x.ma,luot:0,sao:0,giay:0},(x.hoc||{})[TK_TUAN])).sort((a,b)=>b.luot-a.luot||b.sao-a.sao||a.ma-b.ma);
  const tong=k=>ds.reduce((s,x)=>s+x[k],0);
  khung(`<div class="tkso"><div><b>${ds.length}</b>bạn đã vào học</div><div><b>${tong('luot')}</b>lượt học</div><div><b>${tong('sao')}</b>ngôi sao ⭐</div></div>`+
   (ds.length?`<div style="overflow-x:auto"><table class="tkb"><thead><tr><th>Tên (số thứ tự)</th><th>Lượt</th><th>⭐</th><th>Thời gian</th></tr></thead><tbody>${ds.map(x=>`<tr><td>${esc(x.ten)} (${x.ma})</td><td>${x.luot}</td><td>${x.sao}</td><td>${tkGio(x.giay)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="tip center" style="margin-top:14px">Tuần này chưa có bạn nào vào học. Con học trước đi!</p>'))
 }).catch(()=>khung('<p class="tip center" style="margin-top:14px">Chưa lấy được số liệu. Con mở lại khi có mạng nhé.</p>'));
}

function learn(i){
 stopRec();
 const w=W[i];
 app.innerHTML=`<div class="card">
  <div class="label">Thẻ lật ${i+1}/7</div>
  <div class="flip" id="flip" role="button" tabindex="0" aria-label="Lật thẻ">
   <div class="flip-in">
    <div class="face front">
     <img class="pic" src="${IMG[w.id]}" alt="">
     <div class="word">${w.en}</div>
     <div class="turn">👆 Chạm để lật thẻ, xem nghĩa</div>
    </div>
    <div class="face back">
     <div class="word">${w.en}</div>
     <div class="ipa">${w.ipa}</div>
     <div class="read">Đọc gần giống: <b>${w.rd}</b></div>
     <div class="vi" style="margin-top:12px">${w.vi}</div>
     <div class="read" style="margin-top:12px">Đánh vần: <b>${w.en.toUpperCase().split('').join(' ')}</b></div>
     <div class="turn">👆 Chạm để lật lại</div>
    </div>
   </div>
  </div>
  ${sp(w)}
  ${recHTML()}
  <div class="dots">${W.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</div>
  <div class="row" style="margin-top:10px">
   <button class="btn" onclick="${i?`learn(${i-1})`:'home()'}">← ${i?'Thẻ trước':'Về đầu'}</button>
   ${i<6?`<button class="btn primary" onclick="learn(${i+1})">Thẻ tiếp →</button>`:`<button class="btn primary" onclick="play()">▶ Chơi ngay</button>`}
  </div></div>`;
 const f=$('#flip');const tg=()=>{f.classList.toggle('flipped');say(w.en)};
 f.onclick=tg;f.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tg()}};
 // swipe left/right to change card
 let x0=null;f.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});
 f.addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>60){if(dx<0&&i<6)learn(i+1);else if(dx>0&&i>0)learn(i-1)}});
 bindRec(w);
 say(w.en);
}

/* ---- game ---- */
let G;
function play(only){
 setStars(0);
 const list=only||STAGES.map((_,i)=>i);
 G={list,si:0,queue:shuffle(W),done:0,total:W.length*list.length,miss:{},t0:Date.now()};
 next();
}
const curStage=()=>STAGES[G.list[G.si]];
function head(){
 const pct=Math.round(G.done/G.total*100),cur=G.list[G.si];
 /* thanh các phần: bấm được để chuyển phần, có nút về trang đầu */
 return `<div class="stage"><button class="hm" onclick="home()">🏠 Trang đầu</button>${STAGES.map((s,k)=>{const i=G.list.indexOf(k);return `<button class="${k===cur?'on':(i>=0&&i<G.si)?'done':''}" onclick="jumpStage(${k})">${s.name}</button>`}).join('')}</div>
 <div class="prog"><i style="width:${pct}%"></i></div>`;
}
function jumpStage(k){stopRec();const i=G.list.indexOf(k);if(i<0||G.list.length===1){play([k]);return}G.si=i;G.queue=shuffle(W);G.done=i*W.length;next()}
function next(){
 stopRec();
 if(!G.queue.length){G.si++;if(G.si>=G.list.length)return finish();G.queue=shuffle(W)}
 const w=G.queue[0], s=curStage();
 app.innerHTML=head()+`<div class="card"><div class="label">${s.hint}</div><div id="task"></div><div class="fb" id="fb"></div><div id="nextBox"></div></div>`;
 ({listen,read,extra,build,speak,fill,write})[s.k](w);
}
function result(ok,w,msg,manual){
 const fb=$('#fb');
 if(ok){beep(1);setStars(stars+1);fb.className='fb ok';fb.textContent=msg||'Giỏi quá! 🎉';G.queue.shift();G.done++;}
 else{beep(0);fb.className='fb no';fb.textContent=msg||'Chưa đúng, con thử lại nhé!';G.miss[w.id]=(G.miss[w.id]||0)+1;
  // put the word back a little later in this stage so it gets practised again
  G.queue.shift();G.queue.splice(Math.min(2,G.queue.length),0,w);}
 if(manual){{const rb=$('#recBox');if(rb)rb.before(fb)}$('#nextBox').innerHTML=`<div class="row" style="margin-top:12px"><button class="btn primary" id="goNext">Câu tiếp theo →</button></div>`;$('#goNext').onclick=next}
 else setTimeout(next,ok?900:1500);
}
function miss(w,text){beep(0);G.miss[w.id]=(G.miss[w.id]||0)+1;$('#fb').className='fb no';$('#fb').textContent=text}
function options(w,n=4){return shuffle([w,...shuffle(W.filter(x=>x!==w)).slice(0,n-1)])}
function lock(){document.querySelectorAll('#task .opt,#task .tile,#task .blank,#task .chip').forEach(b=>b.disabled=true)}

function listen(w){
 const o=options(w);
 $('#task').innerHTML=`<div class="row" style="margin-top:10px"><button class="btn blue" onclick="say('${w.en}')">🔊 Nghe lại</button><button class="btn" onclick="say('${w.en}',1)">🐢 Nghe chậm</button></div>
 <div class="grid2">${o.map(x=>`<button class="opt" data-id="${x.id}"><img src="${IMG[x.id]}" alt="hình"></button>`).join('')}</div>`;
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const ok=b.dataset.id===w.id;b.classList.add(ok?'ok':'no');
  if(ok){lock();result(true,w,`Đúng! ${w.en} = ${w.vi}`)}else{miss(w,'Chưa đúng, nghe lại nhé!');b.disabled=true}});
 setTimeout(()=>say(w.en),300);
}
function read(w){
 const o=options(w);
 $('#task').innerHTML=`<div class="word center">${w.en}</div><div class="ipa center">${w.ipa}</div>
 <div class="grid2">${o.map(x=>`<button class="opt" data-id="${x.id}">${x.vi}</button>`).join('')}</div><div id="recBox"></div>`;
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const ok=b.dataset.id===w.id;b.classList.add(ok?'ok':'no');lock();
  if(!ok)document.querySelector(`.opt[data-id="${w.id}"]`).classList.add('ok');say(w.en);
  $('#recBox').innerHTML=recHTML();bindRec(w);
  result(ok,w,ok?'Đúng rồi! Giờ con đọc to và thu âm nhé 🎙️':`${w.en} nghĩa là "${w.vi}". Con đọc to và thu âm nhé!`,true)});
}
function extra(w){
 // Easy version: hear the word, then pick the correct spelling (the other has 1 extra letter)
 const word=w.en, idx=[];
 for(let i=1;i<word.length;i++){if(/[a-z]/i.test(word[i])&&/[a-z]/i.test(word[i-1]))idx.push(i)}
 const abc='aeioulnrstdmpbk';let pos,ch,tries=0;
 do{pos=idx[Math.random()*idx.length|0];ch=abc[Math.random()*abc.length|0];tries++}while(tries<60&&(ch===word[pos-1].toLowerCase()||ch===word[pos].toLowerCase()));
 const wrong=word.slice(0,pos)+ch+word.slice(pos);
 const opts=shuffle([{t:word,ok:1},{t:wrong,ok:0}]);
 $('#task').innerHTML=`<img class="pic" src="${IMG[w.id]}" alt="" style="margin-top:8px;max-height:170px">
 <div class="center"><span class="vi">${w.vi}</span></div>
 <div class="row" style="margin-top:10px"><button class="btn blue" onclick="sayW('${w.id}')">🔊 Nghe lại</button><button class="btn" onclick="sayW('${w.id}',1)">🐢 Nghe chậm</button></div>
 <div class="grid2" style="grid-template-columns:1fr">${opts.map(o=>`<button class="opt" data-ok="${o.ok}" style="font-family:var(--display);font-size:1.7rem;padding:14px">${esc(o.t)}</button>`).join('')}</div>`;
 document.querySelectorAll('#task .opt').forEach(b=>b.onclick=()=>{const ok=b.dataset.ok==='1';b.classList.add(ok?'ok':'no');
  if(ok){lock();say(w.en);result(true,w,`Đúng rồi! ${w.en} = ${w.vi}`)}else{miss(w,'Chưa đúng, nghe lại và nhìn kỹ nhé!');b.disabled=true}});
 setTimeout(()=>say(w.en),300);
}
function sum(a,n){return a.slice(0,n).reduce((x,y)=>x+y,0)}
function build(w){
 const target=w.en.replace(/ /g,'').toLowerCase(), words=w.en.toLowerCase().split(' ');
 let pos=0;
 const letters=shuffle(target.split(''));
 $('#task').innerHTML=`<img class="pic" src="${IMG[w.id]}" alt="" style="margin-top:8px;max-height:180px">
 <div class="center"><span class="vi">${w.vi}</span> <span class="ipa">${w.ipa}</span></div>
 <div class="slots">${words.map(x=>x.split('').map(()=>'<div class="slot"></div>').join('')).join('<div class="gap"></div>')}</div>
 <div class="tiles">${letters.map(c=>`<button class="tile" data-c="${c}">${c}</button>`).join('')}</div>
 <div class="row" style="margin-top:12px"><button class="btn" onclick="say('${w.en}',1)">🐢 Nghe gợi ý</button></div>`;
 const slots=document.querySelectorAll('.slot');let wrong=0;
 document.querySelectorAll('#task .tile').forEach(t=>t.onclick=()=>{
  if(t.dataset.c===target[pos]){slots[pos].textContent=t.dataset.c;t.disabled=true;pos++;
   if(pos===target.length){lock();say(w.en);result(wrong<3,w,wrong<3?'Ghép đúng rồi! 🧩':'Xong rồi, lần sau cố gắng ít sai hơn nhé!')}}
  else{wrong++;t.classList.add('no');setTimeout(()=>t.classList.remove('no'),400);miss(w,'Chữ tiếp theo không phải chữ này')}
 });
}
function speak(w){
 $('#task').innerHTML=`<img class="pic" src="${IMG[w.id]}" alt="" style="margin-top:8px">
 <div class="center"><span class="vi">${w.vi}</span></div>
 <p class="tip center">Con hãy nói to từ tiếng Anh của hình này, thu âm rồi nghe lại.</p>
 ${recHTML()}
 <div id="rev" hidden class="center"><div class="word">${w.en}</div><div class="ipa">${w.ipa}</div><div class="read">Đọc gần giống: ${w.rd}</div></div>
 <div class="row" id="sp1" style="margin-top:12px"><button class="btn primary" id="show">👀 Xem đáp án</button></div>
 <div class="row" id="sp2" hidden style="margin-top:12px">
  <button class="btn primary" id="yes">✅ Con nói đúng</button>
  <button class="btn" id="again">🔁 Nói lại</button>
 </div>`;
 bindRec(w);
 $('#show').onclick=()=>{$('#rev').hidden=false;$('#sp1').hidden=true;$('#sp2').hidden=false;say(w.en)};
 $('#yes').onclick=()=>{$('#sp2').hidden=true;result(true,w,'Phát âm hay lắm! 🗣️')};
 $('#again').onclick=()=>{say(w.en,1);$('#recTip').textContent='Nghe chậm rồi thu âm lại nhé!'};
}
function fill(w){
 const [a,b]=w.s.split('___');
 $('#task').innerHTML=`<img class="pic" src="${IMG[w.id]}" alt="" style="margin-top:8px;max-height:170px">
 <div class="sent">${esc(a)}<input class="blank" id="blank" autocomplete="off" autocapitalize="off" spellcheck="false" size="${Math.max(6,w.en.length)}" aria-label="ô trống">${esc(b)}</div>
 <p class="tip center">${w.sv}</p>
 <div class="label" style="margin-top:8px">Chạm vào từ để điền, hoặc tự gõ</div>
 <div class="chips">${shuffle(W).map(x=>`<button class="chip" data-w="${x.en}">${x.en}</button>`).join('')}</div>
 <div class="row" style="margin-top:12px"><button class="btn blue" onclick="say('${esc(w.s.replace('___','...'))}')">🔊 Nghe câu</button><button class="btn primary" id="chk">Kiểm tra</button></div>`;
 const inp=$('#blank');let tries=0;
 document.querySelectorAll('#task .chip').forEach(c=>c.onclick=()=>{inp.value=c.dataset.w;say(c.dataset.w)});
 const chk=()=>{const v=inp.value.trim().toLowerCase().replace(/\s+/g,' ');
  if(v===w.en){lock();inp.disabled=true;say(w.s.replace('___',w.en));result(true,w,'Điền đúng rồi! 📝')}
  else{tries++;if(tries>=2){inp.value='';miss(w,`Từ đúng là: ${w.en}. Con điền lại nhé!`)}else miss(w,'Chưa đúng, đọc lại câu và nhìn hình nhé!')}};
 $('#chk').onclick=chk;inp.onkeydown=e=>{if(e.key==='Enter')chk()};
}
function write(w){
 $('#task').innerHTML=`<img class="pic" src="${IMG[w.id]}" alt="" style="margin-top:8px;max-height:180px">
 <div class="center"><span class="vi">${w.vi}</span> <span class="ipa">${w.ipa}</span></div>
 <div class="row" style="margin-top:10px"><button class="btn blue" onclick="say('${w.en}')">🔊 Nghe</button><button class="btn" onclick="say('${w.en}',1)">🐢 Chậm</button><button class="btn" id="hint">💡 Gợi ý</button></div>
 <input class="type" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="gõ từ ở đây">
 <div class="row" style="margin-top:10px"><button class="btn primary" id="chk">Kiểm tra</button></div>`;
 let tries=0, hints=0;
 $('#hint').onclick=()=>{hints++;const a=$('#ans');a.value=w.en.slice(0,Math.min(w.en.length,hints+1));a.focus()};
 const chk=()=>{const v=$('#ans').value.trim().toLowerCase().replace(/\s+/g,' ');
  if(v===w.en){$('#ans').disabled=true;$('#chk').disabled=true;say(w.en);result(true,w,'Viết đúng chính tả! ✏️')}
  else{tries++;if(tries>=2){$('#ans').value='';miss(w,`Từ đúng là: ${w.en}. Con gõ lại nhé!`)}else miss(w,'Gần đúng rồi, nghe lại và sửa nhé!')}};
 $('#chk').onclick=chk;$('#ans').onkeydown=e=>{if(e.key==='Enter')chk()};
 setTimeout(()=>{say(w.en);$('#ans').focus()},300);
}
function finish(){
 baoHoc();
 stopRec();
 if(stars>best){best=stars;try{localStorage.setItem('gb12best',best)}catch(e){}}
 const hard=W.filter(w=>G.miss[w.id]).sort((a,b)=>G.miss[b.id]-G.miss[a.id]);
 app.innerHTML=head()+`<div class="card center"><div class="big">🏆</div><div class="word">Hoàn thành!</div>
 <p>Con được <b>⭐ ${stars}</b> ngôi sao.</p>
 ${hard.length?`<p class="tip">Từ cần ôn thêm (chạm để mở thẻ lật):</p><div class="learnlist">${hard.map(w=>`<button class="mini" onclick="learn(${W.indexOf(w)})"><b>${w.en}</b><span>${w.ipa}</span><div class="read">${w.vi} · sai ${G.miss[w.id]} lần</div></button>`).join('')}</div>`:'<p>Không sai từ nào. Tuyệt vời! 🌟</p>'}
 <div class="rec" style="text-align:left">
  <div class="label">📨 Gửi kết quả cho cô</div>
  <label for="kidName" class="tip" style="display:block">Tên của con</label>
  <input class="type" id="kidName" style="margin-top:4px;font-size:1.2rem" placeholder="Ví dụ: Nguyễn Minh An" autocomplete="off">
  <textarea id="report" readonly rows="6" style="width:100%;margin-top:10px;font:600 .95rem var(--body);padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical"></textarea>
  <div class="row" style="margin-top:10px"><button class="btn primary" id="copyRep">📋 Sao chép kết quả</button></div>
  <p class="tip" id="copyTip">Sao chép xong, bố mẹ dán vào nhóm Zalo lớp 2A8 để gửi cô nhé.</p>
 </div>
 <div class="row" style="margin-top:14px"><button class="btn" onclick="home()">Về đầu</button><button class="btn primary" onclick="play(G.list)">Chơi lại</button></div></div>`;
 beep(1);
 const nm=$('#kidName'),rep=$('#report');
 try{nm.value=localStorage.getItem('gb12name')||''}catch(e){}
 const d=new Date(),p=n=>String(n).padStart(2,'0');
 const build=()=>{const name=nm.value.trim()||'(chưa ghi tên)';
  rep.value=`🌟 Học tiếng Anh Tuần 12 – Lớp 2A8\nBé: ${name}\nĐã chơi: ${G.list.map(k=>STAGES[k].name.replace(/^\S+\s/,'')).join(', ')}\nĐiểm: ⭐ ${stars}/${G.total}\n${hard.length?'Từ cần ôn: '+hard.map(w=>w.en).join(', '):'Không sai từ nào 🎉'}\nThời gian: ${p(d.getHours())}:${p(d.getMinutes())} ngày ${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()}`};
 build();
 nm.oninput=()=>{build();try{localStorage.setItem('gb12name',nm.value.trim())}catch(e){}};
 $('#copyRep').onclick=()=>{build();const ok=()=>{$('#copyTip').textContent='Đã sao chép! Mở nhóm Zalo lớp và dán vào ô tin nhắn nhé.'};
  const fail=()=>{rep.focus();rep.select();$('#copyTip').textContent='Máy chưa tự sao chép được. Chữ đã được bôi đen, bấm giữ rồi chọn Sao chép nhé.'};
  try{navigator.clipboard.writeText(rep.value).then(ok,fail)}catch(e){fail()}};
}
home();
</script>

</body></html>
